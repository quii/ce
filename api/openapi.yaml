openapi: 3.0.3
info:
  title: ce
  version: 0.1.0
paths:
  /greeting:
    get:
      operationId: getGreeting
      summary: Get a greeting, optionally personalized with a name
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required:
        - greeting
      properties:
        greeting:
          type: string
