services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ce
      POSTGRES_PASSWORD: ce
      POSTGRES_DB: ce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ce -d ce"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      DATABASE_URL: postgres://ce:ce@postgres:5432/ce?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  relay:
    build:
      context: .
      args:
        SERVICE: relay
    environment:
      DATABASE_URL: postgres://ce:ce@postgres:5432/ce?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: .
      args:
        SERVICE: web
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8090:8080"
    depends_on:
      - api
    restart: on-failure
