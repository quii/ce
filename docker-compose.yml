services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ce
      POSTGRES_PASSWORD: ce
      POSTGRES_DB: ce
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      args:
        SERVICE: api
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  relay:
    build:
      context: .
      args:
        SERVICE: relay
    depends_on:
      - postgres

  web:
    build:
      context: .
      args:
        SERVICE: web
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8090:8080"
    depends_on:
      - api
